name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "assistant-knowledge.js"
      - "site-assistant.js"
      - ".github/workflows/backend-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "assistant-knowledge.js"
      - "site-assistant.js"
      - ".github/workflows/backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check --prefix api

